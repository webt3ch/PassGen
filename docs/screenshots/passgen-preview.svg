<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">PassGen interface preview</title>
  <desc id="desc">A static illustration of the PassGen password generator's dark interface, password output card, and configuration controls.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151a12"/>
      <stop offset="0.6" stop-color="#10120f"/>
      <stop offset="1" stop-color="#11150f"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2019"/>
      <stop offset="1" stop-color="#171a16"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" rx="24" fill="url(#background)"/>
  <rect x="48" y="34" width="34" height="34" rx="10" fill="#c7f36b" fill-opacity=".08" stroke="#c7f36b" stroke-opacity=".45"/>
  <path d="M65 40 76 45v7c0 6-4 10-11 13-6-3-11-7-11-13v-7z" fill="none" stroke="#c7f36b" stroke-width="1.8"/>
  <path d="m60 51 4 4 7-8" fill="none" stroke="#c7f36b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="94" y="57" fill="#f0f1e9" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">pass</text>
  <text x="143" y="57" fill="#c7f36b" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">gen</text>
  <rect x="184" y="40" width="36" height="20" rx="5" fill="#1d211b" stroke="#2c312a"/>
  <text x="202" y="54" fill="#969d90" font-family="Inter,Arial,sans-serif" text-anchor="middle" font-size="10" font-weight="700">v1.4</text>
  <circle cx="1030" cy="51" r="4" fill="#c7f36b"/>
  <text x="1043" y="55" fill="#969d90" font-family="Inter,Arial,sans-serif" font-size="13">Browser-only</text>
  <path d="M48 90H1152" stroke="#232821"/>
  <text x="48" y="137" fill="#c7f36b" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2">A SMALL TOOL FOR A BIG JOB</text>
  <text x="48" y="198" fill="#f0f1e9" font-family="Inter,Arial,sans-serif" font-size="48" font-weight="650" letter-spacing="-2">Passwords,</text>
  <text x="48" y="249" fill="#969d90" font-family="Inter,Arial,sans-serif" font-size="48" font-weight="500" letter-spacing="-2">generated properly.</text>
  <text x="48" y="283" fill="#a4aa9c" font-family="Inter,Arial,sans-serif" font-size="15">Create a random password with control over its length and character set.</text>
  <text x="48" y="305" fill="#a4aa9c" font-family="Inter,Arial,sans-serif" font-size="15">Generation happens in your browser, without an account or application server.</text>
  <rect x="48" y="337" width="620" height="332" rx="18" fill="url(#card)" stroke="#2c312a"/>
  <rect x="688" y="337" width="464" height="332" rx="18" fill="url(#card)" stroke="#2c312a"/>
  <text x="74" y="373" fill="#92998a" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.4">01 / GENERATED OUTPUT</text>
  <text x="74" y="405" fill="#f0f1e9" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="600">Your password</text>
  <rect x="510" y="382" width="132" height="27" rx="7" fill="#171a16" stroke="#2c312a"/>
  <circle cx="524" cy="395" r="3" fill="#c7f36b"/>
  <text x="534" y="399" fill="#969d90" font-family="Inter,Arial,sans-serif" font-size="10">Password ready</text>
  <rect x="74" y="430" width="568" height="80" rx="12" fill="#121510" stroke="#39442e"/>
  <text x="96" y="477" fill="#c7f36b" font-family="SFMono-Regular,Consolas,monospace" font-size="25" letter-spacing="5">••••••••••••••••••••</text>
  <rect x="594" y="451" width="31" height="35" rx="8" fill="#1b1f19" stroke="#2c312a"/>
  <path d="M599 468s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z" fill="none" stroke="#bdc3b5" stroke-width="1.4"/>
  <circle cx="609" cy="468" r="2.5" fill="none" stroke="#bdc3b5" stroke-width="1.4"/>
  <text x="74" y="544" fill="#d5d9ce" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600">Estimated entropy</text>
  <text x="620" y="544" fill="#c7f36b" font-family="SFMono-Regular,Consolas,monospace" font-size="13" text-anchor="end">~129 bits</text>
  <text x="74" y="566" fill="#92998a" font-family="Inter,Arial,sans-serif" font-size="11">Theoretical estimate of valid outputs; not a security certification.</text>
  <text x="74" y="590" fill="#b8c0ae" font-family="Inter,Arial,sans-serif" font-size="11">Generated with 20 characters · 86-character alphabet</text>
  <rect x="74" y="614" width="286" height="37" rx="9" fill="#c7f36b"/>
  <text x="217" y="637" fill="#1b2410" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">↻  Generate password</text>
  <rect x="370" y="614" width="272" height="37" rx="9" fill="#20241d" stroke="#3a4035"/>
  <text x="506" y="637" fill="#e0e4d9" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="650" text-anchor="middle">▢  Copy password</text>
  <text x="714" y="373" fill="#92998a" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.4">02 / CONFIGURATION</text>
  <text x="714" y="405" fill="#f0f1e9" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="600">Make it yours</text>
  <text x="714" y="446" fill="#d5d9ce" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600">Password length</text>
  <rect x="1084" y="430" width="42" height="26" rx="7" fill="#20241d" stroke="#3b4530"/>
  <text x="1105" y="447" fill="#c7f36b" font-family="SFMono-Regular,Consolas,monospace" font-size="12" text-anchor="middle">20</text>
  <rect x="714" y="468" width="412" height="4" rx="2" fill="#3a4035"/>
  <rect x="714" y="468" width="92" height="4" rx="2" fill="#c7f36b"/>
  <circle cx="806" cy="470" r="8" fill="#c7f36b" stroke="#171a16" stroke-width="3"/>
  <text x="714" y="492" fill="#92998a" font-family="Inter,Arial,sans-serif" font-size="10">8 characters</text>
  <text x="1126" y="492" fill="#92998a" font-family="Inter,Arial,sans-serif" font-size="10" text-anchor="end">64 characters</text>
  <rect x="714" y="505" width="51" height="28" rx="7" fill="#1d211b" stroke="#2c312a"/>
  <text x="740" y="523" fill="#b9c0b1" font-family="SFMono-Regular,Consolas,monospace" font-size="11" text-anchor="middle">16</text>
  <rect x="773" y="505" width="51" height="28" rx="7" fill="#c7f36b" fill-opacity=".08" stroke="#627746"/>
  <text x="799" y="523" fill="#c7f36b" font-family="SFMono-Regular,Consolas,monospace" font-size="11" text-anchor="middle">20</text>
  <rect x="832" y="505" width="51" height="28" rx="7" fill="#1d211b" stroke="#2c312a"/>
  <text x="858" y="523" fill="#b9c0b1" font-family="SFMono-Regular,Consolas,monospace" font-size="11" text-anchor="middle">32</text>
  <rect x="891" y="505" width="51" height="28" rx="7" fill="#1d211b" stroke="#2c312a"/>
  <text x="917" y="523" fill="#b9c0b1" font-family="SFMono-Regular,Consolas,monospace" font-size="11" text-anchor="middle">48</text>
  <path d="M714 550H1126" stroke="#232821"/>
  <text x="714" y="572" fill="#d5d9ce" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600">Character sets</text>
  <g font-family="Inter,Arial,sans-serif" font-size="12" fill="#d5d9ce">
    <text x="732" y="598">Uppercase</text><text x="732" y="622">Lowercase</text><text x="732" y="646">Numbers</text>
  </g>
  <g stroke="#c7f36b" fill="#c7f36b">
    <rect x="1080" y="586" width="39" height="19" rx="10"/><circle cx="1108" cy="595" r="6" fill="#252f17" stroke="#252f17"/>
    <rect x="1080" y="610" width="39" height="19" rx="10"/><circle cx="1108" cy="619" r="6" fill="#252f17" stroke="#252f17"/>
    <rect x="1080" y="634" width="39" height="19" rx="10"/><circle cx="1108" cy="643" r="6" fill="#252f17" stroke="#252f17"/>
  </g>
  <text x="48" y="718" fill="#92998a" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.4">PASSGEN / BUILT FOR EVERYDAY SECURITY</text>
  <text x="1152" y="718" fill="#92998a" font-family="Inter,Arial,sans-serif" font-size="11" text-anchor="end">Static UI preview</text>
</svg>
